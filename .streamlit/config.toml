# Streamlit settings for the finance dashboard. It only runs on this laptop.

[server]
address = "localhost"   # not reachable from other devices on the network
headless = false        # open the browser on start
runOnSave = false

[browser]
serverAddress = "localhost"
gatherUsageStats = false  # no usage data sent to Streamlit

[client]
toolbarMode = "viewer"    # ⋮ menu shows only viewer options: Settings (light/dark theme), Print, Rerun

# Look: colors from the validated dataviz palette. The app follows the computer's light/dark setting;
# switch in ⋮ -> Settings -> Choose app theme.
[theme]
font = "'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif"
headingFont = "'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif"
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
dataframeBorderColor = "#e1e0d9"
dataframeHeaderBackgroundColor = "#f3f2ee"
linkColor = "#2a78d6"
greenColor = "#006300"
greenTextColor = "#006300"
redColor = "#d03b3b"
redTextColor = "#b52f2f"
blueColor = "#2a78d6"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#242423"
textColor = "#f5f5f2"
borderColor = "#383835"
dataframeBorderColor = "#383835"
dataframeHeaderBackgroundColor = "#242423"
linkColor = "#6da7ec"
greenColor = "#0ca30c"
greenTextColor = "#3fc43f"
redColor = "#e66767"
redTextColor = "#f08a8a"
blueColor = "#3987e5"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
